<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Courses — DMI</title><link rel="stylesheet" href="css/styles.css"><style>
.container{max-width:900px;margin:auto;padding:1.5rem}.fields{display:grid;grid-template-columns:1fr 2fr auto;gap:1rem;align-items:end}.field{display:flex;flex-direction:column}.course-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1.5rem}.course-group h2{font-size:1rem;margin-bottom:.75rem}.course-group ul{padding-left:1.25rem}.course-group li{margin:.4rem 0}.hint{color:var(--text-muted);font-size:.875rem;margin:.75rem 0}[hidden]{display:none!important}@media(max-width:600px){.fields{grid-template-columns:1fr}}
</style></head><body><header class="dmi-header"><div class="dmi-logo"><div class="dmi-logo-mark">D</div><span>DMI Smart Campus</span></div><button class="btn btn-ghost" onclick="logout()">Logout</button></header>
<main class="container"><a href="reception-dashboard.html">← Back to admin panel</a><h1 style="margin-top:1rem">Manage Courses</h1><p class="hint">Add a course to a department. Reception can then select it when registering students at any branch.</p>
<form class="card" id="course-form"><div class="fields"><div class="field"><label class="label" for="course-department">Department</label><select class="select" id="course-department" required><option value="">Select department…</option><option>IT</option><option>English</option><option>Kids</option><option>IELTS</option><option>BCSS</option></select></div><div class="field"><label class="label" for="course-name">New course name</label><input class="input" id="course-name" required minlength="2" maxlength="100" placeholder="Enter course name"></div><button class="btn btn-primary" id="save-course">Save course</button></div><p class="hint" id="course-status" role="status"></p></form>
<div class="course-list" id="course-list" aria-live="polite"></div></main><script src="js/api.js"></script><script src="js/admin-courses.js"></script></body></html>
